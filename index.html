(function(){

  const cur = new URLSearchParams(location.search).get('v');
  fetch('version.txt?t='+Date.now(), {cache:'no-store'})
    .then(r=>r.ok?r.text():null)
    .then(t=>{

const W = 480, H = 270, GROUND = 222;

const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

let cam = {x:0, tx:0, lock:true}; // lock: auto-lock ke titik aksi (bisa toggle klik pojok / tombol L)
let camDrag = null; // {sx, stx} untuk geser kamera manual saat unlock
function actionPoint(){
  if(!G) return null;
  const alive = G.fighters.filter(f=>f.alive&&f.onStage);
  if(!alive.length) return null;
  if(alive.length<3){
    let mn=1e9, mx=-1e9;
    for(const f of alive){ if(f.x<mn)mn=f.x; if(f.x>mx)mx=f.x; }
    return (mn+mx)/2;
  }
  // 3+ fighter: kunci ke pasangan terdekat — di sanalah aksinya!
  let best=1e9, bx=(alive[0].x+alive[1].x)/2;
  for(let i=0;i<alive.length;i++) for(let j=i+1;j<alive.length;j++){
    const d=Math.abs(alive[i].x-alive[j].x);
    if(d<best){ best=d; bx=(alive[i].x+alive[j].x)/2; }
  }
  return bx;
}
function updateCamera(){
  if(!G) return;
  let targetX=null;
  if(cam.lock) targetX=actionPoint();
  // saat unlock: kamera full manual (drag/arrow), tidak auto-center
  if(targetX!==null) cam.tx = clamp(targetX - W/2, 0, WORLD_W-W);
  cam.x += (cam.tx-cam.x)*0.08;
  if(Math.abs(cam.tx-cam.x)<0.5) cam.x=cam.tx;
}

const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const rnd = (a,b)=>a+Math.random()*(b-a);
const rndi = (a,b)=>Math.floor(rnd(a,b+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
function rect(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w|0,h|0); }

// ---------- audio ----------
let AC=null, muted=false, masterGain=null;
function audioInit(){
  if(AC) return;
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    masterGain = AC.createGain(); masterGain.gain.value = 0.35;
    masterGain.connect(AC.destination);
  }catch(e){ AC=null; }
}
let SFX_PITCH = 1; // voice pitch karakter yang sedang berbunyi (beda tiap ninja!)
function beep(freq, dur, type='square', vol=1, slide=0){
  if(!AC || muted) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(Math.max(20, freq*SFX_PITCH), t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,(freq+slide)*SFX_PITCH), t+dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t+dur+0.02);
}
function noiseBurst(dur=0.15, vol=0.8, low=400){
  if(!AC || muted) return;
  const t = AC.currentTime, len = Math.floor(AC.sampleRate*dur);
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const src = AC.createBufferSource(); src.buffer=buf;
  const f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=low;
  const g = AC.createGain(); g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(f); f.connect(g); g.connect(masterGain); src.start(t);
}
const SFX = {
  hit(){ noiseBurst(0.12,0.9,900); beep(160,0.1,'square',0.7,-80); },
  block(){ beep(300,0.08,'square',0.4); },

  shuriken(){ beep(1400,0.12,'sawtooth',0.35,-900); },

  upper(){ beep(200,0.25,'sawtooth',0.8,600); noiseBurst(0.2,0.5,1200); },
  guard(){ beep(500,0.3,'sine',0.6,200); },
  nova(){ beep(800,0.4,'sine',0.7,-600); noiseBurst(0.3,0.5,2000); },
  jump(){ beep(300,0.12,'square',0.3,300); },
  ko(){ beep(400,0.8,'square',0.8,-350); },
  select(){ SFX_PITCH=1; beep(660,0.07,'square',0.5); setTimeout(()=>beep(880,0.09,'square',0.5),70); },

// ---------- komentator ----------
let commQueue=[], commCur=null;
function comment(text, dur){
  commQueue.push({text, t:dur||260});
  if(commQueue.length>4) commQueue.shift();
}
function updateComm(){
  if(commCur){ if(--commCur.t<=0) commCur=null; }
  else if(commQueue.length) commCur=commQueue.shift();
}
function drawComm(){
  if(!commCur || (mode!=='fight'&&mode!=='roundend')) return;
  const w = Math.min(452, commCur.text.length*6+30);
  rect(W/2-w/2, H-28, w, 20, '#0a0a19');
  rect(W/2-w/2, H-28, w, 2, '#ffd94d');
  rect(W/2-w/2, H-10, w, 2, '#2a2a4a');
  ctx.font='bold 9px monospace'; ctx.textAlign='center'; ctx.fillStyle='#ffe9a8';
  ctx.fillText('» '+commCur.text, W/2, H-14);
}
// nama + bar HP di atas kepala (dalam battle, bukan di pojok)
function drawFighterTag(f){
  if(!f.alive || !f.onStage) return;
  const sc = f.def.scale||1;
  const y = f.y - 46*sc;
  const w = 40*sc;
  ctx.font='bold '+Math.max(7, Math.round(7*sc))+'px monospace';
  ctx.textAlign='center';
  const nc = f.teamColor ? f.teamColor : f.def.color;
  ctx.fillStyle='#000';
  ctx.fillText(f.def.name, f.x+1, y-7);
  ctx.fillStyle=nc;
  ctx.fillText(f.def.name, f.x, y-8);
  // bar HP
  rect(f.x-w/2-1, y-5, w+2, 6, '#000');
  rect(f.x-w/2, y-4, w, 4, '#301010');
  const hpR = clamp(f.hp/f.maxHp, 0, 1);
  ctx.fillStyle = hpR>0.5?'#5aff5a':hpR>0.25?'#ffd94d':'#ff5a4d';
  ctx.fillRect(f.x-w/2, y-4, w*hpR, 4);
}
// ---------- kill feed ----------
let killfeed=[];
function addKillFeed(killer, victim, color){
  killfeed.unshift({text:killer+' ⚔ '+victim, color, t:300});
  if(killfeed.length>5) killfeed.pop();
}
function updateKillFeed(){
  for(let i=killfeed.length-1;i>=0;i--){
    if(--killfeed[i].t<=0) killfeed.splice(i,1);
  }
}
function drawKillFeed(){
  if(!G || (mode!=='fight'&&mode!=='roundend')) return;
  ctx.font='bold 8px monospace'; ctx.textAlign='right';
  killfeed.forEach((k,i)=>{
    const y=54+i*14;
    ctx.globalAlpha=clamp(k.t/60,0,1);
    const wdt=ctx.measureText(k.text).width+14;
    rect(W-wdt-8, y-10, wdt, 13, 'rgba(8,8,18,0.8)');
    ctx.fillStyle=k.color;
    ctx.fillText(k.text, W-14, y);
    ctx.globalAlpha=1;
  });
}
// ---------- panel statistik (pojok kiri atas) ----------
function drawStatsPanel(){
  if(!G || (mode!=='fight'&&mode!=='roundend')) return;
  ctx.font='8px monospace';
  // urut kill terbanyak di atas
  const fs=[...G.fighters].sort((a,b)=>b.kills-a.kills || b.dmgDealt-a.dmgDealt);
  const pw=148, ph=24+fs.length*11;
  rect(4, 4, pw, ph, 'rgba(8,8,18,0.82)');
  rect(4, 4, pw, 2, '#ffd94d'); // aksen emas
  ctx.textAlign='left'; ctx.fillStyle='#8a8aa8';
  ctx.fillText('— STATS —', 10, 15);
  ctx.textAlign='right'; ctx.fillStyle='#5a5a78';
  ctx.fillText('K', 96, 15); ctx.fillText('A', 112, 15); ctx.fillText('DMG', 142, 15);
  ctx.textAlign='left';
  fs.forEach((f,i)=>{
    const y=19+i*11;
    const col=f.alive?(f.teamColor||f.def.color):'#555566';
    rect(10, y+1, 6, 6, col); // dot warna karakter/tim
    ctx.fillStyle=f.alive?'#e8e8f0':'#555566';
    ctx.fillText(f.def.name, 20, y+8);
    ctx.textAlign='right'; ctx.fillStyle=f.alive?'#cfcfe8':'#555566';
    ctx.fillText(''+f.kills, 96, y+8);
    ctx.fillText(''+f.assists, 112, y+8);
    ctx.fillText(''+Math.round(f.dmgDealt), 142, y+8);
    ctx.textAlign='left';
  });
}
// ---------- indikator auto-lock kamera (pojok kanan atas, klik untuk toggle) ----------
function drawCamLock(){
  if(!G || (mode!=='fight'&&mode!=='roundend')) return;
  const cx=W-18, cy=18;
  const col = cam.lock ? '#ffd94d' : '#555566';
  // simbol target: lingkaran + crosshair (digambar manual, anti-tofu)
  ctx.strokeStyle=col; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(cx, cy, 7, 0, 6.2832); ctx.stroke();
  rect(cx-11, cy-1, 4, 2, col); rect(cx+7, cy-1, 4, 2, col);
  rect(cx-1, cy-11, 2, 4, col); rect(cx-1, cy+7, 2, 4, col);
  rect(cx-1, cy-1, 3, 3, col);
  ctx.font='7px monospace'; ctx.textAlign='center'; ctx.fillStyle=col;
  ctx.fillText(cam.lock?'LOCK':'FREE', cx, cy+18);
  ctx.textAlign='left';
}

// ---------- stage hazard ----------
let hazards=[];
let orbs=[]; // heal orb pickup (batch 4)
const HAZ_INFO={
  bolt:{dmg:18, rad:26, warn:'⚡', msg:'Sambaran petir menyambar arena!'},
  rock:{dmg:15, rad:34, warn:'▼', msg:'Batu besar jatuh dari langit!'},
  vine:{dmg:8,  rad:34, warn:'❀', msg:'Akar berduri mencengkeram!'},
};
function updateHazards(){
  if(!G || G.phase!=='fight') return;
  if(--G.hazT<=0){
    G.hazT = rndi(650, 950);
    hazards.push({x:rnd(80,WORLD_W-80), type:curStage.hazard, phase:'warn', t:70});
    beep(220, 0.2, 'square', 0.4, -100); // bunyi peringatan
  }
  for(let i=hazards.length-1;i>=0;i--){
    const h=hazards[i];
    if(--h.t<=0){
      if(h.phase==='warn'){
        h.phase='hit'; h.t=28;
        applyHazard(h);
      } else hazards.splice(i,1);
    }
  }
}
function applyHazard(h){
  const info=HAZ_INFO[h.type];
  shake=Math.max(shake,5); SFX.special();
  for(const f of G.fighters){
    if(!f.alive||!f.onStage) continue;
    if(Math.abs(f.x-h.x)<info.rad){
      f.hurt(info.dmg, Math.sign(f.x-h.x||1)*2, null);
      if(h.type==='vine') f.slow=150;
    }
  }
  if(h.type==='bolt') spawnParticles(h.x, GROUND-40, 14, ['#fff8a8','#ffd94d','#fff'], 3);
  else if(h.type==='rock') spawnParticles(h.x, GROUND, 14, ['#8a7a6a','#5a4a3a'], 3);
  else spawnParticles(h.x, GROUND-10, 12, ['#46b95a','#9ae8a8'], 2);
  comment(info.msg);
}
function drawHazards(){
  for(const h of hazards){
    if(h.phase==='warn'){
      if(Math.floor(h.t/8)%2===0){
        ctx.font='bold 12px monospace'; ctx.textAlign='center';
        ctx.fillStyle='#ff5a4d'; ctx.fillText(HAZ_INFO[h.type].warn, h.x, GROUND-46);
        rect(h.x-12, GROUND-40, 24, 3, '#ff5a4d');
      }
    } else {
      if(h.type==='bolt'){
        rect(h.x-4, 0, 8, GROUND, '#fff8a8');
        rect(h.x-2, 0, 4, GROUND, '#ffffff');
      } else if(h.type==='rock'){
        const p = 1-h.t/28;
        rect(h.x-10, GROUND-60+p*44, 20, 16, '#6a5a4a');
        rect(h.x-7, GROUND-58+p*44, 14, 12, '#8a7a6a');
      } else {
        for(let v=0;v<5;v++) rect(h.x-14+v*7, GROUND-24+((v*7)%10), 4, 24, '#46b95a');
      }
    }
  }
}

// ---------- heal orb (batch 4) ----------
function spawnOrb(){
  const x = rnd(70, WORLD_W-70);
  orbs.push({x, t:rndi(900,1400), ph:rnd(0,6.28)});
  spawnParticles(x, GROUND-14, 10, ['#7dff9a','#ffffff'], 2);
}
function updateOrbs(){
  for(let i=orbs.length-1;i>=0;i--){
    const o=orbs[i];
    o.t--; o.ph+=0.08;
    if(o.t<=0){ orbs.splice(i,1); continue; }
    for(const f of G.fighters){
      if(!f.alive||!f.onStage||!f.onGround) continue;
      if(Math.abs(f.x-o.x)<14){
        f.hp = Math.min(f.maxHp, f.hp + Math.ceil(f.maxHp*0.2));
        spawnFloater(f.x, f.y-52, '+HEAL', '#7dff9a');
        spawnParticles(f.x, f.y-16, 12, ['#7dff9a','#ffffff'], 2);
        SFX.guard();
        comment(f.def.name+' mengambil orb penyembuh!');
        orbs.splice(i,1);
        break;
      }
    }
  }
}
function drawOrbs(){
  for(const o of orbs){
    const bob = Math.sin(o.ph)*3, y = GROUND-14+bob;
    const blink = o.t<120 ? (Math.floor(o.t/10)%2===0 ? 1 : 0.25) : 1;
    ctx.globalAlpha = 0.35*blink;
    rect(o.x-9, y-9, 18, 18, '#7dff9a');
    ctx.globalAlpha = 1;
    rect(o.x-4, y-4, 8, 8, '#7dff9a');
    rect(o.x-2, y-2, 4, 4, '#ffffff');
    ctx.globalAlpha = 0.9*blink;
    rect(o.x-1, y-7, 2, 14, '#ffffff');
    rect(o.x-7, y-1, 14, 2, '#ffffff');
    ctx.globalAlpha = 1;
  }
}

// ---------- sprite ninja prosedural ----------
function drawFighter(f){
  const c = f.def.color, dark = f.def.dark;
  const x = Math.round(f.x), y = Math.round(f.y);
  const dir = f.facing;
  const flash = f.state==='hurt' && (f.stateT%6<3);
  const slowed = f.slow>0;
  const skin = flash ? '#ffffff' : (slowed ? '#cfe8ff' : '#f2c89b');
  const cloth = flash ? '#ffffff' : (slowed ? '#3a4a5e' : '#23232e');
  const accent = flash ? '#ffffff' : c;
  const darkC = flash ? '#ffffff' : dark;

  ctx.save();
  ctx.translate(x, y);
  const P = f.pose;
  const bsc = f.def.scale||1;
  ctx.scale(dir*bsc, bsc);
  if(P==='crouch') ctx.translate(0, 4); // jongkok

  const PT = f.stateT;
  const bob = (P==='idle') ? (PT%40<20?0:-1) : 0;
  const wStep = (P==='walk') ? (PT%16<8?1:-1) : 0;

  // penanda tim (mode team)
  if(f.teamColor){
    rect(-2,-32+bob,4,4,f.teamColor);
    rect(-1,-31+bob,2,2,'#ffffff');
  }
  // perisai Iron Guard
  if(f.guard>0){
    const gl = (PT%10<5);
    ctx.strokeStyle = gl ? '#9ad8ff' : '#4a8ac8';
    ctx.lineWidth = 1;
    ctx.strokeRect(-9, -28+bob, 18, 30);
  }

  if(P==='ko'){
    rect(-11, -5, 22, 5, cloth);
    rect(-14, -6, 5, 6, skin);
    rect(-15, -7, 7, 2, darkC);
    rect(6, -5, 5, 5, accent);
    ctx.restore(); return;
  }

  if(P==='kick'){
    rect(-3, -8, 3, 8, cloth);
    rect(2, -6, 9, 3, darkC);
  } else if(P==='dash'){
    rect(-7, -6, 5, 6, cloth);            // kaki belakang
    rect(3, -6, 6, 6, cloth);             // kaki depan
  } else if(P==='walk'){
    rect(-4, -8, 3, 8 + wStep, cloth);
    rect(1, -8, 3, 8 - wStep, cloth);
  } else if(P==='jump'){
    rect(-4, -7, 3, 5, cloth);
    rect(1, -6, 4, 4, cloth);
  } else {
    rect(-4, -8, 3, 8, cloth);
    rect(1, -8, 3, 8, cloth);
  }
  rect(-4, -16+bob, 8, 9, cloth);
  rect(-4, -16+bob, 8, 2, accent);
  rect(-5, -14+bob, 2, 6, darkC);
  if(P==='punch'){
    rect(3, -15+bob, 9, 3, skin);
    rect(10, -15+bob, 3, 3, darkC);
  } else if(P==='upper'){
    rect(4, -24+bob, 3, 9, skin);          // tinju ke atas
    rect(4, -26+bob, 5, 3, '#ff9a2e');
  } else if(P==='dash'){
    rect(4, -15+bob, 7, 3, skin);          // lengan ayun
    rect(-7, -14+bob, 4, 3, skin);
  } else if(P==='spin'){
    rect(-10, -15+bob, 6, 3, skin);        // dua tangan horizontal
    rect(4, -15+bob, 9, 3, skin);
  } else if(P==='charge'){
    rect(-9, -14+bob, 6, 3, skin);         // tangan ke belakang (kumpulkan energi)
    rect(-4, -16+bob, 3, 3, '#ff9a2e');
  } else if(P==='ultcharge'){
    rect(-2, -26+bob, 3, 10, skin);        // kedua tangan ke atas
    rect(3, -26+bob, 3, 10, skin);
    rect(-3, -28+bob, 9, 3, '#c88cff');
  } else if(P==='block'){
    rect(2, -17+bob, 3, 7, skin);
    rect(5, -17+bob, 3, 7, skin);
  } else if(P==='special'){
    rect(3, -16+bob, 7, 3, accent);
    rect(8, -18+bob, 4, 7, skin);
  } else {
    rect(3, -14+bob, 2, 6, skin);
  }
  rect(-3, -23+bob, 7, 7, skin);
  rect(-4, -24+bob, 9, 3, darkC);
  rect(4, -24+bob, 4, 1, accent);
  rect(1, -20+bob, 2, 2, '#20202a');
  rect(-5, -22+bob, 2, 8, '#cfcfcf');

  ctx.restore();
}

// ---------- background ----------
const stars = [];
for(let i=0;i<70;i++) stars.push({x:rnd(0,W), y:rnd(0,150), t:rnd(0,60)});
let torchT = 0;
function drawSky(){
  // cache gradient per stage (optimasi: jangan bikin tiap frame)
  if(drawSky._st!==curStage || !drawSky._g){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,curStage.sky[0]); g.addColorStop(0.7,curStage.sky[1]); g.addColorStop(1,curStage.sky[2]);
    drawSky._g = g; drawSky._st = curStage;
  }
  ctx.fillStyle = drawSky._g; ctx.fillRect(0,0,W,H);
  for(const s of stars){
    const tw = menuFx ? (s.t+torchT)%60<30 : true; // mode RINGAN: bintang diam
    rect(s.x, s.y, 1, 1, tw?'#ffffff':'#8888aa');
  }
  ctx.fillStyle = '#f5f0d8'; ctx.beginPath(); ctx.arc(390,52,26,0,7); ctx.fill();
  rect(384,44,5,5,'#e0d8b8'); rect(396,58,4,4,'#e0d8b8'); rect(388,62,3,3,'#e0d8b8');
  // gunung jauh dengan parallax mengikuti kamera
  ctx.fillStyle = curStage.mtn;
  const off = -(((cam.x*0.3)%480+480)%480);
  for(let x=off-480; x<W+480; x+=480){
    ctx.beginPath(); ctx.moveTo(x,GROUND);
    ctx.lineTo(x+60,150); ctx.lineTo(x+130,GROUND);
    ctx.lineTo(x+190,130); ctx.lineTo(x+290,GROUND);
    ctx.lineTo(x+360,160); ctx.lineTo(x+480,GROUND); ctx.fill();
  }
}
function drawWorld(){
  // ruang dunia: digambar dengan translate(-cam.x)
  const s = curStage;
  ctx.fillStyle = s.mtn2;
  for(let x=-160; x<WORLD_W+160; x+=320){
    ctx.beginPath(); ctx.moveTo(x,GROUND);
    ctx.lineTo(x+80,GROUND-46); ctx.lineTo(x+160,GROUND); ctx.fill();
  }
  rect(-120, GROUND, WORLD_W+240, H-GROUND, s.ground);
  rect(-120, GROUND, WORLD_W+240, 3, s.line);
  for(let x=-120;x<WORLD_W+120;x+=24) rect(x, GROUND+3, 2, H-GROUND-3, '#2c2118');
  for(let x=-108;x<WORLD_W+120;x+=24) rect(x, GROUND+10, 2, H-GROUND-10, '#2c2118');
  for(let x=80; x<WORLD_W; x+=160){
    rect(x-2, GROUND-26, 4, 26, '#4a3524');
    rect(x-3, GROUND-30, 6, 5, '#2c2118');
    const fl = menuFx ? Math.sin(torchT*0.3 + x)*2 : 0; // RINGAN: api obor diam
    rect(x-3, GROUND-38+fl, 6, 9, '#ff9a2e');
    rect(x-2, GROUND-36+fl, 4, 6, '#ffd94d');
  }
  torchT++;
}
function drawBackground(){
  drawSky();
  const s = curStage;
  rect(0, GROUND, W, H-GROUND, s.ground);
  rect(0, GROUND, W, 3, s.line);
  for(const tx of [26, W-26]){
    rect(tx-2, GROUND-26, 4, 26, '#4a3524');
    rect(tx-3, GROUND-30, 6, 5, '#2c2118');
    const fl = menuFx ? Math.sin(torchT*0.3 + tx)*2 : 0; // RINGAN: api obor diam
    rect(tx-3, GROUND-38+fl, 6, 9, '#ff9a2e');
    rect(tx-2, GROUND-36+fl, 4, 6, '#ffd94d');
  }
  torchT++;
}

// ---------- FX ----------
let projectiles = [], particles = [], floaters = [], ghosts = [];
let shake = 0, hitstop = 0;
function spawnParticles(x,y,n,colors,spd=2){
  if(!menuFx) return; // mode RINGAN: tanpa percikan
  for(let i=0;i<n;i++)
    particles.push({x,y,vx:rnd(-spd,spd),vy:rnd(-spd,spd-1),t:rndi(15,35),c:pick(colors)});
}
function spawnFloater(x,y,text,c='#ffd94d'){ floaters.push({x,y,text,c,t:50}); }
function updateFx(){
  if(!menuFx){ // mode RINGAN: buang semua partikel & afterimage
    if(particles.length) particles.length=0;
    if(ghosts.length) ghosts.length=0;
  }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.15;
    if(--p.t<=0) particles.splice(i,1);
  }
  for(let i=floaters.length-1;i>=0;i--){
    const f=floaters[i]; f.y-=0.6;
    if(--f.t<=0) floaters.splice(i,1);
  }
  for(let i=ghosts.length-1;i>=0;i--){
    if(--ghosts[i].t<=0) ghosts.splice(i,1);
  }
  if(shake>0) shake*=0.85;
}
function drawFx(){
  if(menuFx){ // mode RINGAN: tanpa afterimage & percikan (floater teks tetap)
  for(const gh of ghosts){
    ctx.globalAlpha = Math.max(0, gh.t/14)*0.35;
    rect(gh.x-4, gh.y-16, 8, 9, gh.color);
    rect(gh.x-3, gh.y-23, 7, 7, gh.color);
    ctx.globalAlpha = 1;
  }
  for(const p of particles) rect(p.x,p.y,2,2,p.c);
  }
  ctx.font='bold 8px monospace'; ctx.textAlign='center';
  for(const f of floaters){
    ctx.fillStyle='#000'; ctx.fillText(f.text,f.x+1,f.y+1);
    ctx.fillStyle=f.c; ctx.fillText(f.text,f.x,f.y);
  }
}
function updateProjectiles(all){
  for(let i=projectiles.length-1;i>=0;i--){
    const p = projectiles[i];
    p.x += p.vx; p.y += (p.vy||0); if(p.vy) p.vy += 0.02; p.t--;
    if(p.kind==='fireball' && Math.random()<0.6)
      particles.push({x:p.x,y:p.y,vx:rnd(-1,1),vy:rnd(-1,1),t:12,c:pick(['#ff7a2e','#ffd94d'])});
    let dead = p.t<=0 || p.x<-20 || p.x>WORLD_W+20;
    if(!dead){
      for(const foe of all){
        if(foe===p.from || !foe.onStage || foe.state==='ko') continue;
        if(foe.team===p.from.team) continue;      // no friendly fire
        const fsc = foe.def.scale||1;
        if(Math.abs(foe.x-p.x)<12*fsc && Math.abs(foe.y-14*fsc-p.y)<18*fsc){
          foe.hurt(p.dmg, Math.sign(p.vx)*2, p.from);
          spawnParticles(p.x,p.y,8,[p.color,'#fff'],2.5);
          dead=true; break;
        }
      }
    }
    if(dead) projectiles.splice(i,1);
  }
}
function drawProjectiles(){
  for(const p of projectiles){
    if(p.kind==='fireball'){
      rect(p.x-5,p.y-4,10,8,'#ff7a2e'); rect(p.x-3,p.y-3,6,6,'#ffd94d'); rect(p.x-1,p.y-2,3,4,'#fff');
    } else if(p.kind==='blade'){
      rect(p.x-4,p.y-2,8,4,'#bfe8ff'); rect(p.x-2,p.y-4,4,8,'#ffffff');
    } else {
      const s = Math.floor(p.t/3)%2;
      rect(p.x-3,p.y-1,6,2,p.color);
      rect(p.x-1,p.y-3,2,6,s?'#ffffff':p.color);
    }
  }
}

// ---------- Fighter ----------
let FID = 0;
class Fighter {
  constructor(def, x, facing, team, teamColor, charIdx){
    this.id = FID++;
    this.def = def; this.charIdx = charIdx;
    this.team = team; this.teamColor = teamColor || null;
    this.persona = pick(PERSONAS);
    this.adapt = {myAtk:0, foeBlocks:0, foeJumps:0, foeProj:0};
    this._foeWasAir = false; this._lastFoeProj = 0;
    this.projectilesThrown = 0;
    this.spree = 0; this.lastKillT = -9999;
    this.x = x; this.y = GROUND; this.vx = 0; this.vy = 0;
    this.facing = facing;
    this.maxHp = def.hp; this.hp = def.hp;
    this.chakra = 50; this.maxChakra = 100;
    this.ult = 0; this._warned = false;
    this.state = 'idle'; this.stateT = 0; this.pose = 'idle';
    this.skill = clamp(def.skill * rnd(0.9,1.1), 0.7, 1.25);
    this.aiT = rndi(0,6); this.retargetT = 0; this.target = null;
    this.input = {};
    this.cool = { atk:0, shu:0, s1:0, s2:0, dash:0 };
    this.dodgeT = 0; this.dashDir = 1;
    this.combo = 0; this.comboT = 0;
    this.dmgDealt = 0; this.kills = 0; this.assists = 0;
    this.hitBy = new Set(); // pelacak assist
    this.respawnT = 0; // timer respawn (frame)
    this.blocking = false; this.onStage = true;
    this.guard = 0; this.slow = 0;
    this.dashHit = false; this.slamDone = false; this.novaDone = false;
    this.atkKind = 'punch'; this.curSp = null;
    this.wins = 0; // team/ffa: dipakai di level tim
  }
  get onGround(){ return this.y >= GROUND; }
  get busy(){ return ['attack','special','hurt','ko','dash','ultimate'].includes(this.state); }
  get alive(){ return this.state!=='ko'; }
  reset(x, facing){
    this.x=x; this.y=GROUND; this.vx=0; this.vy=0; this.facing=facing;
    this.hp=this.maxHp; this.chakra=50;
    this.state='idle'; this.stateT=0;
    this.cool={atk:0,shu:0,s1:0,s2:0,dash:0};
    this.dodgeT=0;
    this.combo=0; this.blocking=false;
    this.guard=0; this.slow=0; this.onStage=true;
    this.dashHit=false; this.target=null; this.curSp=null;
    this.adapt={myAtk:0,foeBlocks:0,foeJumps:0,foeProj:0};
    this._foeWasAir=false; this._lastFoeProj=0;
    this.projectilesThrown=0; this.spree=0; this.lastKillT=-9999;
  }
  hurt(dmg, kx, attacker, unblockable){
    if(this.state==='ko' || !this.onStage || this.state==='ultimate') return;
    if(G && G.frame!==undefined) G.lastDmgFrame = G.frame; // lacak damage terakhir (anti-stuck)
    if(this.dodgeT>0){ // menghindar sempurna!
      spawnParticles(this.x, this.y-14, 3, ['#ffffff','#bfe8ff'], 1);
      if(Math.random()<0.25){ spawnFloater(this.x, this.y-32, 'MISS', '#ffffff'); }
      if(Math.random()<0.12 && G) comment(this.def.name+' menghindari serangan dengan sempurna!');
      return;
    }
    const _vp=SFX_PITCH; SFX_PITCH=this.def.voice||1; // suara khas si korban
    if(this.guard>0) dmg = Math.ceil(dmg*0.3);
    if(this.blocking && this.onGround && this.guard<=0 && !unblockable){
      dmg = Math.ceil(dmg*0.3); SFX.block();
      spawnParticles(this.x, this.y-14, 4, ['#9ad8ff','#ffffff'], 1.5);
      this.hp = Math.max(0, this.hp-dmg);
      if(attacker){ attacker.dmgDealt += dmg; attacker.adapt.foeBlocks++; }
      if(attacker && attacker!==this) this.hitBy.add(attacker);
    } else {
      this.state='hurt'; this.stateT=0; SFX.hit(); shake=Math.min(6,shake+3);
      spawnParticles(this.x, this.y-14, 8, ['#ff5a4d','#ffd94d','#ffffff'], 2.5);
      hitstop = Math.max(hitstop, 4);
      this.hp = Math.max(0, this.hp-dmg);
      this.vx = kx;
      if(attacker){ attacker.dmgDealt += dmg; attacker.ult=Math.min(100,attacker.ult+dmg*0.5); }
      if(attacker && attacker!==this) this.hitBy.add(attacker);
      this.ult=Math.min(100,this.ult+dmg*0.25);
    }
    this.combo=0;
    if(this.hp<=0){
      this.state='ko'; this.stateT=0; SFX.ko();
      // set timer respawn jika aktif (team deathmatch)
      if(G && G.respawnSec>0) this.respawnT = G.respawnSec*60;
      hitstop = Math.max(hitstop, 14);
      shake = Math.max(shake, 8);
      // ledakan partikel warna karakter (lebih meriah)
      spawnParticles(this.x, this.y-10, 28, [this.def.color, this.def.dark,'#ffffff','#ffd94d'], 4);
      spawnParticles(this.x, this.y-20, 12, ['#ffffff','#ffd94d'], 2);
      spawnFloater(this.x, this.y-52, 'K.O.!', this.def.color);
      // gelombang kejut
      for(let a=0;a<16;a++){
        const ang=a/16*Math.PI*2;
        particles.push({x:this.x, y:this.y-14, vx:Math.cos(ang)*5, vy:Math.sin(ang)*5,
          t:22, c:this.def.color, ring:true});
      }
      if(attacker && attacker!==this){
        attacker.kills++;
        // assist untuk yang ikut damage (kecuali killer)
        for(const a of this.hitBy){
          if(a!==attacker && a!==this) a.assists++;
        }
        this.hitBy.clear();
        // pengumuman
        if(G && G.phase==='fight'){
          if(!G.firstBlood){ G.firstBlood=true; spawnFloater(W/2, 88, 'FIRST BLOOD!', '#ff5a4d'); SFX.select(); }
          comment(attacker.def.name+' menghabisi '+this.def.name+'!');
          addKillFeed(attacker.def.name, this.def.name, attacker.teamColor||attacker.def.color);
          const dt = G.frame - attacker.lastKillT;
          attacker.spree = dt<300 ? attacker.spree+1 : 1;
          attacker.lastKillT = G.frame;
          if(G.mode==='ffa' && attacker.spree===2){ spawnFloater(attacker.x, attacker.y-52, 'DOUBLE KILL!', '#ffd94d'); SFX.select(); }
          if(G.mode==='ffa' && attacker.spree>=3){ spawnFloater(attacker.x, attacker.y-52, 'TRIPLE KILL!', '#ff9a2e'); SFX.select(); }
        }
      }
    }
    SFX_PITCH=_vp; // kembalikan pitch penyerang
  }
  startDash(dir, isBack){
    if(this.busy || this.cool.dash>0 || !this.onGround || !this.alive) return;
    this.cool.dash = 46;
    this.state = 'dash'; this.stateT = 0;
    this.dashDir = dir;
    if(isBack) this.dodgeT = 10; // backdash = menghindar (i-frame)
    SFX.whoosh();
    spawnParticles(this.x, this.y, 5, ['#aaa','#fff'], 1.5);
  }
  tryUlt(){
    return; // ULTIMATE dihapus atas permintaan Wily (2026-10-07) — tidak bisa dipicu lagi
    if(this.busy || this.ult<100 || !this.alive) return;
    this.ult=0; this.state='ultimate'; this.stateT=0;
  }
  ultUpdate(foes){
    const S=this.stateT, U=this.def.ult;
    if(S===1){
      G.ultFreeze=this;
      comment(this.def.name+' mengeluarkan ULTIMATE: '+U.name+'!', 300);
      SFX.special(); beep(60,0.8,'sawtooth',0.9,200);
      shake=Math.max(shake,4);
    }
    if(S<50){
      // charge sinematik
      if(S%3===0) particles.push({x:this.x+rnd(-14,14), y:this.y-rnd(0,30), vx:0, vy:-1.2, t:18,
        c:pick(['#c88cff','#ffffff','#ffd94d'])});
    } else if(S===50){
      // DAMAGE sesuai tipe
      shake=12; SFX.special(); noiseBurst(0.5,0.9,400);
      if(U.type==='inferno'){
        for(const foe of foes){
          if(!foe.alive||!foe.onStage) continue;
          if(Math.abs(foe.x-this.x)<140){
            foe.hurt(U.dmg, Math.sign(foe.x-this.x||1)*4, this, true);
            foe.vy=-5; foe.y-=2;
          }
        }
        for(let i=0;i<30;i++)
          particles.push({x:this.x+rnd(-70,70), y:this.y-rnd(0,50), vx:rnd(-2,2), vy:rnd(-4,-1), t:rndi(20,40),
            c:pick(['#ff7a2e','#ffd94d','#ff3a2e','#ffffff'])});
        spawnFloater(this.x, this.y-60, U.name, '#ff7a2e');
      } else if(U.type==='cuts'){
        const targets=foes.filter(f=>f.alive&&f.onStage&&Math.abs(f.x-this.x)<230);
        for(const foe of targets){
          for(let k=0;k<5;k++){
            ghosts.push({x:foe.x+rnd(-16,16), y:foe.y-rnd(4,24), color:this.def.color, t:16});
            foe.hurt(Math.ceil(U.dmg/5), (k%2?1:-1)*2, this, true);
          }
          spawnParticles(foe.x, foe.y-14, 12, ['#bfe8ff','#ffffff'], 3);
        }
        this.x = targets.length? targets[0].x - this.facing*30 : this.x;
        spawnFloater(this.x, this.y-60, U.name, '#bfe8ff');
      } else if(U.type==='crusher'){
        for(const foe of foes){
          if(!foe.alive||!foe.onStage) continue;
          if(foe.onGround && Math.abs(foe.x-this.x)<240) foe.hurt(U.dmg, Math.sign(foe.x-this.x||1)*5, this, true);
        }
        for(let i=0;i<24;i++)
          particles.push({x:rnd(0,W), y:GROUND-rnd(0,10), vx:rnd(-3,3), vy:rnd(-6,-2), t:rndi(25,45),
            c:pick(['#8a7a6a','#5a4a3a','#ffb14d'])});
        spawnFloater(this.x, this.y-60, U.name, '#ffb14d');
      } else if(U.type==='zero'){
        for(const foe of foes){
          if(!foe.alive||!foe.onStage) continue;
          if(Math.abs(foe.x-this.x)>240) continue; // ada batas jarak, tidak kena semua
          foe.hurt(U.dmg, 0, this, true);
          foe.slow=320;
        }
        for(let i=0;i<26;i++)
          particles.push({x:rnd(0,W), y:rnd(0,GROUND), vx:rnd(-1,1), vy:rnd(0.5,1.5), t:rndi(30,60),
            c:pick(['#bfe8ff','#ffffff','#6ad8ff'])});
        spawnFloater(this.x, this.y-60, U.name, '#bfe8ff');
      }
    }
    if(S>140){ this.state='idle'; this.stateT=0; G.ultFreeze=null; }
  }
  tryAttack(){
    if(this.cool.atk>0 || this.busy) return;
    this.cool.atk=22; this.state='attack'; this.stateT=0;
    this.atkKind = Math.random()<0.5?'punch':'kick';
    SFX.whoosh();
  }
  tryShuriken(){
    if(this.cool.shu>0 || this.busy || this.chakra<12) return;
    this.cool.shu=38; this.chakra-=12;
    this.state='attack'; this.stateT=0; this.atkKind='punch';
    SFX.shuriken(); this.projectilesThrown++;
    projectiles.push({
      x:this.x+this.facing*10, y:this.y-16, vx:this.facing*4.2,
      dmg:8, from:this, kind:'shuriken', t:120, color:this.def.color,
    });
  }
  tryS1(){
    const sp = this.def.s1;
    if(this.cool.s1>0 || this.busy || this.chakra<sp.cost) return;
    this.cool.s1=150; this.chakra-=sp.cost;
    this.state='special'; this.stateT=0; this.curSp=sp.type;
    this.fireDone=false; this.stormDone=false; this.slamPhase=0; this.dashHit=false;
    if(sp.type==='fireball') beep(150,0.35,'sawtooth',0.5,250); // charge
    else SFX.special();
    if(sp.type==='dash'){ this.dashHit=true; this.dashDmg=sp.dmg; }
    else if(sp.type==='slam'){ this.slamDmg=sp.dmg; }
  }
  tryS2(){
    const sp = this.def.s2;
    if(this.cool.s2>0 || this.busy || this.chakra<sp.cost) return;
    this.cool.s2=170; this.chakra-=sp.cost;
    this.state='special'; this.stateT=0; this.curSp=sp.type;
    this.upperDone=false; this.novaDone=false; this.bladesDone=false;
    if(sp.type==='uppercut'){
      SFX.upper(); this.atkKind='upper';
      this.upperDone=false; this.upperDmg=sp.dmg;
    } else if(sp.type==='blades'){
      SFX.shuriken(); this.projectilesThrown++;
      for(let i=0;i<2;i++)
        projectiles.push({ x:this.x+this.facing*10, y:this.y-14-i*7, vx:this.facing*4.6,
          dmg:Math.ceil(sp.dmg/2), from:this, kind:'blade', t:120, color:'#bfe8ff' });
    } else if(sp.type==='guard'){
      SFX.guard(); this.guard=240;
      spawnParticles(this.x, this.y-14, 12, ['#9ad8ff','#ffffff'], 2);
      spawnFloater(this.x, this.y-36, sp.name.toUpperCase(), '#9ad8ff');
    } else if(sp.type==='nova'){
      SFX.nova(); this.novaDone=false; this.novaDmg=sp.dmg;
      shake=Math.max(shake,6);
    }
  }
  update(foes){
    SFX_PITCH = this.def.voice||1; // tiap ninja suaranya beda!
    this.stateT++;
    for(const k in this.cool) if(this.cool[k]>0) this.cool[k]--;
    if(this.guard>0) this.guard--;
    if(this.slow>0) this.slow--;
    if(this.dodgeT>0) this.dodgeT--;
    this.chakra = Math.min(this.maxChakra, this.chakra + 0.12);
    this.ult = Math.min(100, this.ult + 0.03);
    if(this.comboT>0 && --this.comboT===0) this.combo=0;

    const inp = this.input, slowed = this.slow>0;
    const spdMul = slowed ? 0.55 : 1;
    this.blocking = !!inp.block && this.onGround && !this.busy;
    if(this.state==='dash'){
      // movement dash: melesat + afterimage
      this.vx = this.dashDir*4.6;
      if(this.stateT%3===0) ghosts.push({x:this.x, y:this.y, color:this.def.color, t:14});
      if(inp.attack && this.stateT>=6){ this.state='idle'; this.stateT=0; this.tryAttack(); }
      else if(this.stateT>13){ this.state='idle'; this.stateT=0; }
    }
    else if(!this.busy && this.alive){
      if(inp.left){ this.vx = -this.def.speed*spdMul; this.facing=-1; }
      else if(inp.right){ this.vx = this.def.speed*spdMul; this.facing=1; }
      else this.vx *= 0.7;
      if(inp.jump && this.onGround){ this.vy=-8.2; SFX.jump(); spawnParticles(this.x,this.y,4,['#aaa','#fff'],1); }
      if(inp.attack) this.tryAttack();
      else if(inp.shuriken) this.tryShuriken();
      else if(inp.special) this.tryS1();
      else if(inp.special2) this.tryS2();
      else if(inp.ult) this.tryUlt();
      else if(inp.dashF) this.startDash(this.facing, false);
      else if(inp.dashB) this.startDash(-this.facing, true);
    }

    const t = this.target;
    const tValid = t && t.alive && t.onStage;
    // melee aktif frame 10
    if(this.state==='attack' && this.stateT===10 && tValid){
      this.adapt.myAtk++;
      const range = this.atkKind==='kick'?26:20;
      const hx = this.x + this.facing*range;
      if(Math.abs(t.x-hx)<14 && Math.abs(t.y-this.y)<26){
        const dmg = this.def.power + rndi(-2,2);
        t.hurt(dmg, this.facing*2.2, this);
        if(++this.combo>=2){
          this.comboT=70; // jendela kombo diperlebar (batch 4)
          spawnFloater(t.x, t.y-34, 'HIT x'+this.combo);
          if(this.combo===5||this.combo===10||this.combo===15||this.combo===20){
            spawnFloater(t.x, t.y-58, this.combo+' HITS!', '#ff9a2e');
            SFX.select();
            comment(this.def.name+' melancarkan kombo '+this.combo+' pukulan!');
          }
        }
      }
    }
    // jurus spesial: animasi bertahap per tipe
    if(this.state==='special') this.specialUpdate(foes);
    // ultimate sinematik
    if(this.state==='ultimate') this.ultUpdate(foes);

    // fisika
    if(!this.onGround || this.vy<0){
      this.vy += 0.5; this.y += this.vy;
      if(this.y>=GROUND){
        this.y=GROUND; this.vy=0;
        spawnParticles(this.x,this.y,3,['#8a7a6a'],1);
        if(this.state==='special' && this.curSp==='slam' && this.slamPhase===1) this.slamLand(foes);
      }
    }
    this.x += this.vx;
    if(this.state!=='dash' && !(this.state==='special' && this.curSp==='dash')) this.vx *= 0.8;
    this.x = clamp(this.x, 20, WORLD_W-20);
    // aura chakra penuh
    if(this.chakra>90 && this.alive && this.onStage && Math.random()<0.25)
      particles.push({x:this.x+rnd(-6,6), y:this.y-rnd(0,24), vx:0, vy:-0.6, t:16, c:pick(['#6ad8ff','#ffffff'])});

    if(!Number.isFinite(this.x+this.y+this.vx+this.vy)){ this.x=240; this.y=GROUND; this.vx=0; this.vy=0; }

    // pose
    if(this.state==='ko') this.pose='ko';
    else if(this.state==='hurt'){ this.pose='hurt'; if(this.stateT>16){this.state='idle';this.stateT=0;} }
    else if(this.state==='attack'){ this.pose=this.atkKind; if(this.stateT>20){this.state='idle';this.stateT=0;} }
    else if(this.state==='dash'){ this.pose='dash'; }
    else if(this.state==='ultimate'){ this.pose='ultcharge'; }
    else if(this.state==='special'){
      const S=this.stateT, C=this.curSp;
      if(C==='fireball') this.pose = S<12?'charge':'special';
      else if(C==='dash') this.pose = S<6?'crouch':'dash';
      else if(C==='slam') this.pose = this.slamPhase===1?'jump':'crouch';
      else if(C==='uppercut') this.pose = S<6?'crouch':'upper';
      else if(C==='blades') this.pose='spin';
      else if(C==='guard') this.pose='block';
      else if(C==='nova') this.pose = S<10?'charge':'special';
      else this.pose='special';
    }
    else if(this.blocking) this.pose='block';
    else if(!this.onGround) this.pose='jump';
    else if(Math.abs(this.vx)>0.3) this.pose='walk';
    else this.pose='idle';
  }
  // animasi tiap jurus: charge -> release -> recovery
  specialUpdate(foes){
    const t=this.target, tValid=t&&t.alive&&t.onStage;
    const S=this.stateT;
    switch(this.curSp){
      case 'fireball': {
        if(S<12){
          if(S%2===0) particles.push({x:this.x+this.facing*rnd(6,14), y:this.y-16+rnd(-4,4),
            vx:-this.facing*1.2, vy:0, t:10, c:pick(['#ff7a2e','#ffd94d'])});
        } else if(!this.fireDone){
          this.fireDone=true; SFX.special(); this.projectilesThrown++;
          projectiles.push({x:this.x+this.facing*12, y:this.y-16, vx:this.facing*3.2,
            dmg:this.def.s1.dmg, from:this, kind:'fireball', t:150, color:'#ff7a2e'});
          spawnParticles(this.x+this.facing*12, this.y-16, 12, ['#ff7a2e','#ffd94d','#fff'], 2.5);
          shake=Math.max(shake,3);
        }
        if(S>26){ this.state='idle'; this.stateT=0; }
        break;
      }
      case 'dash': {
        if(S<6){ this.vx=0; }
        else {
          this.vx=this.facing*7;
          if(S%2===0) ghosts.push({x:this.x, y:this.y, color:this.def.color, t:14});
          if(this.dashHit && tValid && Math.abs(t.x-this.x)<16 && Math.abs(t.y-this.y)<26){
            this.dashHit=false;
            t.hurt(this.dashDmg, this.facing*4, this);
            spawnParticles(t.x,t.y-14,10,[this.def.color,'#fff'],3);
          }
          if(S>30){ this.state='idle'; this.stateT=0; }
        }
        break;
      }
      case 'slam': {
        if(this.slamPhase===0){
          if(S<10){ this.vx=0; }
          else { this.slamPhase=1; this.vy=-6.2; this.y-=2; SFX.jump(); }
        } else if(this.slamPhase===2 && S>this.slamEndT){
          this.state='idle'; this.stateT=0;
        }
        break;
      }
      case 'storm': {
        if(S===4){ this.vy=-4.2; this.vx=-this.facing*2.2; this.y-=1; SFX.jump(); }
        if(S===10 && !this.stormDone){
          this.stormDone=true; SFX.shuriken(); this.projectilesThrown++;
          const sp=this.def.s1;
          for(let i=0;i<5;i++)
            projectiles.push({x:this.x+this.facing*10, y:this.y-16, vx:this.facing*(3.2+i*0.3),
              vy:-1.5+i*0.75, dmg:Math.ceil(sp.dmg/5), from:this, kind:'shuriken', t:130, color:this.def.color});
        }
        if(S>28){ this.state='idle'; this.stateT=0; }
        break;
      }
      case 'uppercut': {
        if(S>=6 && S<=20 && Math.random()<0.5)
          particles.push({x:this.x+rnd(-4,4), y:this.y-rnd(4,20), vx:0, vy:-1, t:12, c:pick(['#ff9a2e','#ffd94d'])});
        if(!this.upperDone && S>=8 && tValid){
          if(Math.abs(t.x-this.x)<30 && Math.abs(t.y-this.y)<30){
            this.upperDone=true;
            t.hurt(this.upperDmg, this.facing*1.5, this, true);
            t.vy=-6.5; t.y-=2;
            spawnParticles(t.x,t.y-20,10,['#ff9a2e','#ffd94d','#fff'],3);
            spawnFloater(t.x,t.y-40,this.def.s2.name,'#ff9a2e');
          }
        }
        if(S>24){ this.state='idle'; this.stateT=0; }
        break;
      }
      case 'blades': {
        if(S<8){ if(S%2===0) spawnParticles(this.x,this.y-14,2,['#bfe8ff'],1); }
        else if(!this.bladesDone){
          this.bladesDone=true; SFX.shuriken(); this.projectilesThrown++;
          const sp=this.def.s2;
          for(let i=0;i<2;i++)
            projectiles.push({x:this.x+this.facing*10, y:this.y-14-i*7, vx:this.facing*4.6,
              dmg:Math.ceil(sp.dmg/2), from:this, kind:'blade', t:120, color:'#bfe8ff'});
        }
        if(S>26){ this.state='idle'; this.stateT=0; }
        break;
      }
      case 'guard': {
        if(S>24){ this.state='idle'; this.stateT=0; }
        break;
      }
      case 'nova': {
        if(S<10){
          if(S%2===0){
            const px=this.x+rnd(-20,20), py=this.y-rnd(0,30);
            particles.push({x:px, y:py, vx:Math.sign(this.x-px)*1, vy:Math.sign((this.y-14)-py)*1,
              t:10, c:pick(['#bfe8ff','#ffffff'])});
          }
        } else if(!this.novaDone){
          this.novaDone=true;
          for(let a=0;a<12;a++)
            particles.push({x:this.x,y:this.y-14,vx:Math.cos(a/12*6.28)*3,vy:Math.sin(a/12*6.28)*3-1,t:22,c:pick(['#bfe8ff','#ffffff','#6ad8ff'])});
          for(const foe of foes){
            if(!foe.alive || !foe.onStage) continue;
            if(Math.abs(foe.x-this.x)<62 && Math.abs(foe.y-this.y)<50){
              foe.hurt(this.novaDmg, Math.sign(foe.x-this.x||1)*2, this, true);
              foe.slow = 200;
            }
          }
          spawnFloater(this.x, this.y-40, this.def.s2.name, '#bfe8ff');
        }
        if(S>30){ this.state='idle'; this.stateT=0; }
        break;
      }
    }
  }
  slamLand(foes){
    this.slamPhase=2; this.slamEndT=this.stateT+18;
    shake=10; SFX.special();
    spawnParticles(this.x, this.y, 20, ['#ffb14d','#ff7a2e','#fff','#8a7a6a'], 4);
    spawnFloater(this.x, this.y-40, this.def.s1.name, '#ffb14d');
    for(const foe of foes){
      if(!foe.alive || !foe.onStage) continue;
      if(Math.abs(foe.x-this.x)<(this.def.s1.radius||70) && foe.onGround) foe.hurt(this.slamDmg, Math.sign(foe.x-this.x||1)*3.5, this, true);
    }
  }
  draw(){ if(this.onStage) drawFighter(this); }
}

// ---------- AI SUPER CERDAS ----------
// spacing, punish, anti-proyektil, anti-air, ekonomi chakra,
// pilih target (FFA), mundur saat sekarat.
Fighter.prototype.chooseTarget = function(foes){
  if(!foes.length) return null;
  if(G && G.mode==='ffa' && Math.random()<0.25){
    // kadang fokus yang paling sekarat
    let w = foes[0];
    for(const f of foes) if(f.hp < w.hp) w = f;
    return w;
  }
  let best = foes[0], bd = Math.abs(foes[0].x - this.x);
  for(const f of foes){
    const d = Math.abs(f.x - this.x);
    if(d < bd){ bd = d; best = f; }
  }
  return best;
};
Fighter.prototype.think = function(foes){
  this.aiT--;
  if(this.aiT>0) return;
  const _diff = AI_LEVELS[aiLevel];
  this.aiT = _diff.react;
  const inp = this.input = {};
  if(this.busy || !this.alive || !this.onStage) return;
  // AI level rendah kadang bengong / salah langkah
  if(_diff.mistake>0 && Math.random()<_diff.mistake){
    if(Math.random()<0.5) return;
    inp[Math.random()<0.5?'left':'right']=true; return;
  }

  this.retargetT--;
  if(!this.target || !this.target.alive || !this.target.onStage || this.retargetT<=0){
    this.target = this.chooseTarget(foes);
    this.retargetT = 90;
  }
  const t = this.target;
  if(!t) return;
  const dx = t.x - this.x, adx = Math.abs(dx), dy = t.y - this.y;
  const dir = Math.sign(dx) || 1;
  this.facing = dir;
  this.blocking = false;

  // --- kepribadian & adaptasi ---
  const pers = this.persona || PERSONAS[3];
  const sk = this.skill * _diff.skill, r = Math.random();
  const aggr = clamp(this.def.aggression + pers.aggro, 0.1, 0.95);
  const s1 = this.def.s1, s2 = this.def.s2;
  const ad = this.adapt;
  // lacak pola lawan
  if(!t.onGround && !this._foeWasAir){ ad.foeJumps++; this._foeWasAir=true; }
  if(t.onGround) this._foeWasAir=false;
  const pd = t.projectilesThrown - this._lastFoeProj;
  if(pd>0){ ad.foeProj += pd; this._lastFoeProj = t.projectilesThrown; }
  const turtle = ad.foeBlocks / Math.max(1, ad.myAtk); // rasio block lawan
  const jumper = ad.foeJumps > 4;
  const spammer = ad.foeProj > 3;

  const inRangeS1 = (s1.type==='fireball' && adx>60 && adx<260) ||
                    (s1.type==='dash' && adx>40 && adx<220) ||
                    (s1.type==='slam' && adx<82 && this.onGround) ||
                    (s1.type==='storm' && adx>50);
  const inRangeS2 = (s2.type==='uppercut' && adx<30 && this.onGround) ||
                    (s2.type==='blades' && adx>60 && adx<280) ||
                    (s2.type==='guard' && adx<130) ||
                    (s2.type==='nova' && adx<62 && this.onGround);

  // 0. MENGHINDAR: baca startup serangan lawan -> backdash (i-frame)!
  const foeStartup = (t.state==='attack' && t.stateT<=6) || (t.state==='special' && t.stateT<=10);
  if(foeStartup && adx<46 && this.onGround && this.cool.dash<=0 && r<0.75*sk){
    if(this.x<64 || this.x>WORLD_W-64){ inp.jump=true; inp[dir>0?'right':'left']=true; }
    else inp.dashB=true;
    return;
  }
  // 0a. LOMPAT MUNDUR: baca startup lawan di jarak menengah -> lompat menjauh!
  if(foeStartup && adx>=46 && adx<120 && this.onGround && r<0.6*sk){
    inp.jump=true; inp[dir>0?'left':'right']=true; return;
  }
  // 0b. TERJEPIT DI POJOK: lompat melewati lawan
  if(((this.x<58 && dir>0) || (this.x>WORLD_W-58 && dir<0)) && adx<70 && r<0.5*sk){
    inp.jump=true; inp[dir>0?'right':'left']=true; return;
  }
  // 1. ANTI-PROYEKTIL
  for(const p of projectiles){    if(p.from.team === this.team) continue;
    const coming = Math.sign(p.vx) === -Math.sign(p.x - this.x);
    if(coming && Math.abs(p.x-this.x)<70 && Math.abs(p.y-(this.y-14))<24){
      if(r < 0.8*sk){
        if(Math.random()<0.55) inp.block = true; else inp.jump = true;
        return;
      }
    }
  }
  // 2. PUNISH
  const tRecover = (t.state==='attack' && t.stateT>14) ||
                   (t.state==='special' && t.stateT>32) || t.state==='hurt';
  if(tRecover && adx < 32 && this.onGround && r < 0.85*sk){ inp.attack = true; return; }
  // 2b. KOMBO: habis mendaratkan pukulan -> kejar lawan yang terpental, sambung serangan!
  if(this.combo>=1 && this.comboT>0 && this.onGround && adx>30 && adx<240 &&
     (t.state==='hurt' || this.hp>this.maxHp*0.3) && r<0.85){
    if(this.cool.dash<=0 && adx>70 && r<0.65*sk){ inp.dashF=true; return; }
    inp[dir>0?'right':'left']=true;
    if(adx>120 && r<0.35) inp.jump=true; // lompat kejar kalau terpental jauh
    return;
  }
  // 2c. JUGGLE: lawan terpental ke udara -> lompat kejar, sambung kombo udara!
  if(!t.onGround && adx<80 && this.onGround && r<0.55*sk){
    inp.jump=true; inp[dir>0?'right':'left']=true; return;
  }
  // 3. ANTI-AIR (lebih agresif kalau lawan tukang lompat)
  const aaThresh = jumper ? 0.85 : 0.65;
  if(dy < -34 && adx < 46 && r < aaThresh*sk){
    if(this.chakra >= s2.cost && s2.type==='uppercut' && adx<30){ inp.special2 = true; return; }
    if(this.chakra >= s2.cost && s2.type==='nova' && adx<60){ inp.special2 = true; return; }
    inp.jump = true;
    if(adx < 30) inp.attack = true;
    return;
  }
  // 3b. KILL CONFIRM: habisi lawan sekarat dengan jurus
  if(this.chakra >= s1.cost && t.hp <= s1.dmg && inRangeS1){ inp.special = true; return; }
  if(this.chakra >= s2.cost && t.hp <= s2.dmg && inRangeS2){ inp.special2 = true; return; }
  // 3c. ANTI-TURTLE: lawan kebanyakan block -> pakai jurus unblockable
  if(turtle > 0.35 && r < 0.7*sk){
    if(this.chakra >= s2.cost && s2.type==='uppercut' && adx<32){ inp.special2 = true; return; }
    if(this.chakra >= s2.cost && s2.type==='nova' && adx<64){ inp.special2 = true; return; }
    if(this.chakra >= s1.cost && s1.type==='slam' && adx<84){ inp.special = true; return; }
  }
  // 3d. ULTIMATE: dihapus atas permintaan Wily (2026-10-07)
  // 3e. ORB HEAL (batch 4): sekarat & ada orb -> ambil!
  if(this.hp < this.maxHp*0.6 && orbs.length && this.onGround && r<0.9){
    let bo=null, bd=1e9;
    for(const o of orbs){ const d=Math.abs(o.x-this.x); if(d<bd){bd=d;bo=o;} }
    if(bo && bd<340 && (adx>80 || bd<70)){
      const odir = bo.x>=this.x?1:-1;
      inp[odir>0?'right':'left']=true;
      this.facing = odir;
      return;
    }
  }
  // 4. JURUS S1: chakra penuh / lawan sekarat + jarak cocok
  if(this.chakra >= s1.cost && (this.chakra > 88 || t.hp < 35) && inRangeS1){ inp.special = true; return; }
  // 4b. DASH S1 sebagai gap-closer: lawan jauh -> terjang pakai jurus!
  if(s1.type==='dash' && this.chakra>=s1.cost && this.cool.s1<=0 && this.onGround && adx>130 && adx<330 && r<0.55*sk*(0.6+pers.aggro)){ inp.special = true; return; }
  // 5. JURUS S2: situasional
  if(this.chakra >= s2.cost && inRangeS2 && r < 0.55*sk*pers.shuMul){
    if(!(s2.type==='guard' && this.hp >= this.maxHp*0.55)){ inp.special2 = true; return; }
  }
  // 5b. ANTI-DEMPET: jangan menabrak fighter lain yang bukan target — jaga formasi, biar cerdas!
  if(this.onGround && typeof G!=='undefined' && G){
    let blocker=null;
    for(const o of G.fighters){
      if(o===this || o===t || !o.alive || !o.onStage || !o.onGround) continue;
      const odx=o.x-this.x;
      if(Math.sign(odx)===dir && Math.abs(odx)<26 && Math.abs(o.y-this.y)<34){ blocker=o; break; }
    }
    if(blocker){
      if(r<0.45){ inp.jump=true; inp[dir>0?'right':'left']=true; return; } // lompat melewati kerumunan
      return; // tahan posisi — jangan numpuk!
    }
  }
  // 6. SPACING
  const pr = this.def.range * pers.rangeMul;
  if(adx > pr + 30){
    if(spammer){
      // lawan spam proyektil: terobos, jangan adu tembak
      if(r < 0.4) inp.jump = true;
      inp[dir>0?'right':'left'] = true; return;
    }
    if(pers.id==='aggressor' && adx>110 && adx<260 && this.cool.dash<=0 && this.onGround && r<0.45){
      inp.dashF=true; return; // dash maju mengejar
    }
    // lompat menyerang: kadang lompat ke arah lawan sambil mendekat
    if(r < 0.18 && adx>110 && adx<240 && this.onGround){
      inp.jump=true; inp[dir>0?'right':'left']=true; return;
    }
    if(this.chakra > 32 && adx < 280 && r < 0.5*sk*pers.shuMul){ inp.shuriken = true; return; }
    if(r < 0.25 && adx > 150) inp.jump = true;
    inp[dir>0?'right':'left'] = true; return;
  }
  if(adx < pr - 22){
    if(r < 0.5){ inp[dir>0?'left':'right'] = true; return; }
  }
  // zoner: lompat mundur jaga jarak ideal (zona nyaman < 90px)
  const awayWall = (dir>0 && this.x<70) || (dir<0 && this.x>WORLD_W-70);
  if(pers.id==='zoner' && adx<90 && !awayWall && r<0.3*sk && this.onGround){
    inp.jump=true; inp[dir>0?'left':'right']=true; return;
  }
  // 7. JARAK SERANG
  if(adx < 32){
    if((t.state==='attack' || t.state==='special') && r < 0.5*sk*pers.blockMul){ inp.block = true; return; }
    if(this.hp < this.maxHp*0.22 && r < 0.55){
      if(this.cool.dash<=0 && !(this.x<52||this.x>WORLD_W-52) && r<0.5){ inp.dashB=true; return; } // kabur!
      if(r<0.3 && this.onGround){ inp.jump=true; inp[dir>0?'left':'right']=true; return; } // lompat mundur kabur
      inp[dir>0?'left':'right'] = true;
      if(Math.random()<0.5) inp.block = true;
      return;
    }
    if(r < aggr*sk + 0.15){ inp.attack = true; return; }
    inp.block = true; return;
  }
  inp[dir>0?'right':'left'] = true;
};

// ---------- hall of fame (localStorage) ----------
function hofGet(){ try{ return JSON.parse(localStorage.getItem('ss8_hof')||'{}'); }catch(e){ return {}; } }
function hofAdd(charIdx){
  try{
    const h = hofGet(); const id = CHARS[charIdx].id;
    h[id] = (h[id]||0)+1;
    localStorage.setItem('ss8_hof', JSON.stringify(h));
  }catch(e){}
}
function hofTop(){
  const h = hofGet(); let best=null, bw=0;
  for(const c of CHARS){ const w=h[c.id]||0; if(w>bw){bw=w;best=c;} }
  return best ? {c:best, w:bw} : null;
}
function hofRecord(){
  // catat pemenang ke hall of fame
  if(!G) return;
  if(G.tourneyDone && G.tourney.champ!=null) hofAdd(G.tourney.champ);
  else if(G.mode==='ffa' && G.finalWinner) hofAdd(G.finalWinner.charIdx);
  else if(G.mode==='team'){
    const ti = G.finalWinner==='A'?0:1;
    for(const f of G.teams[ti]) hofAdd(f.charIdx);
  }
  else if(G.finalWinner){ hofAdd(G.fighters[G.finalWinner==='A'?0:1].charIdx); }
}
let G = null; // {mode, fighters, teams, round, phase, phaseT, timer, frame, winsA, winsB, ffaWins}
let mode = 'title';
let draft = null;   // {mode, need, picked:[], label}
let selMode = 0;
let speed = 1, paused = false;
let menuSpeed = 1; // pengaturan kecepatan di menu awal (1/2/4)
let menuFx = 0; // 0=RINGAN (default, tanpa percikan/animasi), 1=PENUH
// Tingkat kecerdasan AI: 0=GAMPANG .. 4=EXTREM
const AI_LEVELS=[
  {name:'GAMPANG', react:14, skill:0.3, mistake:0.18},
  {name:'MUDAH', react:9, skill:0.6, mistake:0.08},
  {name:'NORMAL', react:5, skill:1.0, mistake:0},
  {name:'SULIT', react:3, skill:1.3, mistake:0},
  {name:'EXTREM', react:2, skill:1.6, mistake:0},
];
let aiLevel = 2; // default NORMAL
const SPEEDS = [1,2,4];
const TEAM_COLORS = ['#3e8fe0', '#e0393e'];

function mkFighter(charIdx, team, x, facing){
  const f = new Fighter(CHARS[charIdx], x, facing, team, team===null?null:TEAM_COLORS[team], charIdx);
  return f;
}
function newMatch(gameMode, picks){
  // picks: duel [a,b] | team [a1,a2,a3,b1,b2,b3] | ffa [a,b,c,d]
  FID = 0;
  speed = menuSpeed; // pakai pengaturan kecepatan dari menu awal
  projectiles = []; particles = []; floaters = []; ghosts = []; orbs = [];
  commQueue=[]; commCur=null; killfeed=[];
  shake = 0; hitstop = 0;
  G = { mode:gameMode, fighters:[], teams:null, round:1,
        phase:'intro', phaseT:110, timer:60*60, frame:0,
        winsA:0, winsB:0, ffaWins:{}, tagQueue:[], finalWinner:null,
        roundsToWin:2, firstBlood:false, tourney:null, tourneyDone:false,
        league:null, hazT:700, ultFreeze:null, flavorT:900, boss:null, lastDmgFrame:0, suddenDeath:false,
        slowmo:0, orbT:600 };
  if(gameMode==='duel'){
    G.fighters.push(mkFighter(picks[0], 0, 250, 1));
    G.fighters.push(mkFighter(picks[1], 1, WORLD_W-250, -1));
  } else if(gameMode==='team'){
    // TEAM DEATHMATCH: ukuran tim dinamis, semua AI main bareng
    const sz = teamSetup.size || 3;
    G.respawnSec = teamSetup.respawn || 0;
    G.timeLimitSec = (teamSetup.timeLimit || 0)*60;
    G.timeLeft = G.timeLimitSec*60;
    G.teams = [[],[]];
    for(let i=0;i<sz;i++){
      const xa = 120+i*110, xb = WORLD_W-120-i*110;
      const fa = mkFighter(picks[i], 0, xa, 1);
      const fb = mkFighter(picks[i+sz], 1, xb, -1);
      G.teams[0].push(fa); G.teams[1].push(fb);
      G.fighters.push(fa, fb);
    }
  } else { // ffa
    const xs = [100, 360, 600, WORLD_W-100];
    for(let i=0;i<4;i++)
      G.fighters.push(mkFighter(picks[i], 10+i, xs[i], i<2?1:-1));
  }
  for(const f of G.fighters) f.reset(f.x, f.facing);
  cam.x=0; cam.tx=0; cam.lock=true;
  mode = 'fight'; SFX.round();
}
function foesOf(f){
  return G.fighters.filter(o => o!==f && o.alive && o.onStage && o.team!==f.team);
}
function activeOf(teamIdx){
  return G.teams[teamIdx].find(f => f.onStage && f.alive) || null;
}
function teamAlive(teamIdx){
  return G.teams[teamIdx].some(f => f.alive);
}
function tagIn(teamIdx){
  const cur = G.teams[teamIdx].find(f => f.onStage);
  if(cur) cur.onStage = false;
  const nxt = G.teams[teamIdx].find(f => f.alive && !f.onStage);
  if(nxt){
    nxt.reset(teamIdx===0?110:W-110, teamIdx===0?1:-1);
    nxt.onStage = true;
    spawnFloater(nxt.x, 120, nxt.def.name+' MASUK!', TEAM_COLORS[teamIdx]);
    SFX.select();
  }
}
function endRound(winnerLabel, scoreTeam, wf){
  // scoreTeam: 0/1 untuk duel & team, id fighter untuk ffa, -1 = seri (tanpa poin)
  // wf: fighter pemenang (untuk deteksi COMEBACK), boleh null
  if(G.mode==='ffa'){
    if(typeof scoreTeam==='number' && scoreTeam>=0)
      G.ffaWins[scoreTeam] = (G.ffaWins[scoreTeam]||0)+1;
  } else if(scoreTeam===0) G.winsA++;
  else if(scoreTeam===1) G.winsB++;
  if(wf && winnerLabel!=='DRAW!' && wf.hp < wf.maxHp*0.25 && wf.alive!==false){
    spawnFloater(wf.x, wf.y-48, 'COMEBACK!', '#ffd94d'); SFX.round();
  }
  if(winnerLabel!=='DRAW!'){
    // slow-mo FINISH (batch 4): momen pukulan penentu diperlambat
    G.slowmo = 78;
    spawnFloater(W/2, 66, 'FINISH!', '#ffd94d');
    beep(70,0.7,'sawtooth',0.9,-40);
    comment(winnerLabel);
  }
  G.phase = 'roundend'; G.phaseT = 150; G.winnerLabel = winnerLabel;
  mode = 'roundend';
}
function checkRoundEnd(){
  if(G.mode==='duel'){
    const [a,b] = G.fighters;
    if(!a.alive && !b.alive){ endRound('DRAW!', -1); return; }
    if(!a.alive) endRound(b.def.name+' MENANG RONDE!', 1, b);
    else if(!b.alive) endRound(a.def.name+' MENANG RONDE!', 0, a);
  } else if(G.mode==='team'){
    // respawn ON: ronde hanya berakhir via batas waktu (bukan eliminasi)
    if(G.respawnSec>0) return;
    // eliminasi: ronde berakhir kalau satu tim habis
    const aAlive = G.teams[0].some(f=>f.alive);
    const bAlive = G.teams[1].some(f=>f.alive);
    if(!aAlive && !bAlive){ endRound('DRAW!', -1); return; }
    if(!aAlive) endRound('TIM MERAH MENANG RONDE!', 1, G.teams[1].find(f=>f.alive));
    else if(!bAlive) endRound('TIM BIRU MENANG RONDE!', 0, G.teams[0].find(f=>f.alive));
  } else if(G.mode==='ffa'){
    const alive = G.fighters.filter(f=>f.alive);
    if(alive.length<=1){
      if(alive.length===1) endRound(alive[0].def.name+' MENANG!', alive[0].id, alive[0]);
      else { endRound('DRAW!', -1); }
    }
  }
  else if(G.mode==='survival'){
    const nHero=G.survSquad?3:1;
    const heroes=G.fighters.slice(0,nHero), foes=G.fighters.slice(nHero);
    if(heroes.every(h=>!h.alive)){
      // game over
      const best=survBestGet(G.survSquad);
      const lead=heroes[0];
      if(G.wave>best.best) survBestSet(G.survSquad, G.wave, lead.def.name);
      comment((G.survSquad?'Squad ':'')+lead.def.name+' gugur di gelombang '+G.wave+'!');
      G.survOver=true; mode='matchend'; SFX.ko();
    } else if(foes.every(f=>!f.alive)){
      G.survKills+=1;
      comment('Gelombang '+G.wave+' dibersihkan!');
      G.phase='waveclear'; G.phaseT=130;
    }
  } else if(G.mode==='boss'){
    const heroes=G.fighters.slice(0,3), boss=G.boss;
    if(!boss.alive){
      for(const h of heroes) if(h.alive) hofAdd(h.charIdx);
      comment('RAIJIN tumbang! Para ninja menang!');
      G.finalWinner='A'; G.bossWin=true; mode='matchend'; SFX.select();
    } else if(heroes.every(h=>!h.alive)){
      comment('RAIJIN tak terkalahkan...');
      G.finalWinner='B'; G.bossWin=false; mode='matchend'; SFX.ko();
    }
  }
}
function decideTimeout(){
  if(G.mode==='duel'){
    const [a,b] = G.fighters;
    if(a.hp===b.hp){ endRound('DRAW!', -1); }
    else if(a.hp>b.hp) endRound(a.def.name+' MENANG (WAKTU)!', 0, a);
    else endRound(b.def.name+' MENANG (WAKTU)!', 1, b);
  } else if(G.mode==='team'){
    const hpA = G.teams[0].reduce((s,f)=>s+Math.max(0,f.hp),0);
    const hpB = G.teams[1].reduce((s,f)=>s+Math.max(0,f.hp),0);
    if(hpA===hpB){ endRound('DRAW!', -1); }
    else if(hpA>hpB) endRound('TIM BIRU MENANG (WAKTU)!', 0, G.teams[0].find(f=>f.alive));
    else endRound('TIM MERAH MENANG (WAKTU)!', 1, G.teams[1].find(f=>f.alive));
  } else if(G.mode==='ffa'){
    const alive = G.fighters.filter(f=>f.alive).sort((a,b)=>b.hp-a.hp);
    if(alive.length) endRound(alive[0].def.name+' MENANG (WAKTU)!', alive[0].id, alive[0]);
    else endRound('DRAW!', -1);
  }
  // survival & boss: timer sangat panjang, failsafe diabaikan
}
function decideTimeUp(){
  // waktu habis: pemenang = kill terbanyak
  if(G.mode==='team'){
    const kA = G.teams[0].reduce((s,f)=>s+f.kills,0);
    const kB = G.teams[1].reduce((s,f)=>s+f.kills,0);
    if(kA===kB){ endRound('DRAW! ('+kA+'-'+kB+')', -1); }
    else if(kA>kB) endRound('TIM BIRU MENANG! ('+kA+'-'+kB+')', 0, G.teams[0].find(f=>f.alive)||G.teams[0][0]);
    else endRound('TIM MERAH MENANG! ('+kB+'-'+kA+')', 1, G.teams[1].find(f=>f.alive)||G.teams[1][0]);
  } else decideTimeout();
}
function matchWinner(){
  if(G.mode==='ffa'){
    let best=null, bw=-1;
    for(const f of G.fighters){
      const w = G.ffaWins[f.id]||0;
      if(w>bw){ bw=w; best=f; }
    }
    return bw>=2 ? best : null;
  }
  if(G.winsA>=G.roundsToWin) return 'A';
  if(G.winsB>=G.roundsToWin) return 'B';
  return null;
}
function tiebreakWinner(){
  // failsafe: ronde terlalu banyak seri -> pemenang dari skor
  if(G.mode==='ffa'){
    let best=G.fighters[0], bw=-1;
    for(const f of G.fighters){ const w=G.ffaWins[f.id]||0; if(w>bw){bw=w;best=f;} }
    return best;
  }
  return G.winsA>=G.winsB ? 'A' : 'B';
}
function startRound(){

  } else if(G.mode==='team'){
    const xsA=[120,230,340], xsB=[WORLD_W-120,WORLD_W-230,WORLD_W-340];
    for(let ti=0;ti<2;ti++){
      G.teams[ti].forEach((f,i)=>{
        f.reset(ti===0?xsA[i]:xsB[i], ti===0?1:-1);
        f.onStage = true;
      });
    }
  } else {
    const xs=[100,360,600,WORLD_W-100];
    G.fighters.forEach((f,i)=>{ f.reset(xs[i%xs.length], i<2?1:-1); f.onStage=true; });
  }
  cam.x=0; cam.tx=0; cam.lock=true;
  G.timer=60*60; G.frame=0; G.phase='intro'; G.phaseT=110;

  if(G.mode==='duel') comment('Ronde '+G.round+': '+G.fighters[0].def.name+' vs '+G.fighters[1].def.name+'!');
  else if(G.mode==='team') comment('Ronde '+G.round+': Tim Biru vs Tim Merah!');
  else if(G.mode==='ffa') comment('Ronde '+G.round+': Deathmatch dimulai!');

function updateFight(){
  if(paused) return;
  if(hitstop>0){ hitstop--; return; }
  if(G.phase==='intro'){ if(--G.phaseT<=0) G.phase='fight'; return; }
  if(G.phase==='waveclear'){
    if(--G.phaseT<=0){ spawnWave(); G.phase='fight'; }
    updateFx();
    return;
  }
  if(G.phase!=='fight') return;
  G.frame++;
  if(--G.timer<=0){ decideTimeout(); return; }
  if(G.frame>5400){ decideTimeout(); return; } // failsafe anti-stall
  // SUDDEN DEATH: 30 detik tanpa damage -> semua kena damage berkala
  if(!G.suddenDeath && G.frame-(G.lastDmgFrame||0)>1800){
    G.suddenDeath=true;
    comment('SUDDEN DEATH! Arena memanas!', 300);
    SFX.round(); shake=Math.max(shake,6);
  }
  if(G.suddenDeath && G.frame%30===0){
    for(const f of G.fighters){
      if(f.alive&&f.onStage) f.hurt(4, 0, null);
    }
    spawnFloater(W/2, 100, 'SUDDEN DEATH', '#ff5a4d');
  }
  // RESPAWN: yang KO hidup lagi setelah timer
  if(G.respawnSec>0){
    for(const f of G.fighters){
      if(!f.alive && f.respawnT>0){
        f.respawnT--;
        if(f.respawnT<=0){
          f.hp=f.def.hp; f.state='idle'; f.stateT=0;
          f.x=80+Math.random()*(WORLD_W-160); f.y=200; f.vx=0; f.vy=0;
          f.hitBy.clear(); f.onStage=true;
          spawnParticles(f.x, f.y-14, 12, [f.def.color,'#ffffff'], 3);
          spawnFloater(f.x, f.y-52, 'RESPAWN!', f.def.color);
        }
      }
    }
  }
  // BATAS WAKTU: cek time limit
  if(G.timeLimitSec>0){
    G.timeLeft--;
    if(G.timeLeft<=0){ decideTimeUp(); return; }
  }
  for(let s=0;s<speed;s++){
    if(G.ultFreeze){
      // sinematik ultimate: waktu berhenti untuk yang lain
      const uf=G.ultFreeze;
      if(uf.alive&&uf.onStage) uf.update(foesOf(uf));
    } else {
      for(const f of G.fighters){
        if(!f.alive || !f.onStage) continue;
        f.think(foesOf(f));
      }
      for(const f of G.fighters){
        if(!f.alive || !f.onStage) continue;
        f.update(foesOf(f));
      }
      // ANTI-DEMPET (fisika): dorong fighter yang saling menumpuk biar tidak jadi satu titik
      for(let i=0;i<G.fighters.length;i++){
        const a=G.fighters[i];
        if(!a.alive||!a.onStage||!a.onGround) continue;
        for(let j=i+1;j<G.fighters.length;j++){
          const b=G.fighters[j];
          if(!b.alive||!b.onStage||!b.onGround) continue;
          const dx=b.x-a.x;
          if(Math.abs(dx)<16 && Math.abs(a.y-b.y)<30){
            const push=Math.max(2,(16-Math.abs(dx))/2);
            const s=dx>=0?1:-1;
            a.x=clamp(a.x-s*push,16,WORLD_W-16);
            b.x=clamp(b.x+s*push,16,WORLD_W-16);
          }
        }
      }
    }
    updateProjectiles(G.fighters);
    updateHazards();
    let anyKo = G.fighters.some(f=>f.onStage && !f.alive);
    if(anyKo) break;
  }
  // heal orb (batch 4): duel / team / ffa
  if(G.mode==='duel'||G.mode==='team'||G.mode==='ffa'){
    if(--G.orbT<=0 && orbs.length<2){ G.orbT=rndi(700,1300); spawnOrb(); }
    updateOrbs();
  }
  // peringatan HP sekarat + flavor komentator
  for(const f of G.fighters){
    if(f.alive && f.onStage && f.hp<f.maxHp*0.2 && !f._warned){
      f._warned=true;
      comment(f.def.name+' dalam bahaya!');
    }
  }
  if(--G.flavorT<=0){ G.flavorT=rndi(900,1500); comment(pick(FLAVOR), 200); }
  updateFx();
  checkRoundEnd();
}
function updateRoundEnd(){
  updateFx();
  if(--G.phaseT<=0){
    let w = matchWinner();
    if(!w && G.round>=9) w = tiebreakWinner();
    if(w){
      if(G.tourney){ advanceTourney(w==='A'?G.fighters[0]:G.fighters[1]); }
      else if(G.league){
        recordLeague(w);
        if(G.league.idx<G.league.matches.length){ mode='lstandings'; G.lstandT=180; SFX.round(); }
        else {
          // juara liga
          let champ=G.league.order[0], bp=-1;
          for(const ci of G.league.order){ const p=G.league.points[ci]||0; if(p>bp){bp=p;champ=ci;} }
          hofAdd(champ);
          G.finalWinner=champ; G.leagueDone=true; mode='matchend'; SFX.select();
        }
      }
      else { G.finalWinner=w; hofRecord(); mode='matchend'; SFX.select(); }
    }
    else { G.round++; startRound(); }
  }
}

function newTourney(picks){
  const order = picks.slice().sort(()=>Math.random()-0.5);
  newMatch('duel', [order[0], order[1]]);
  G.tourney = { order, stage:'sf1', results:[], w1:null, w2:null,
                curA:order[0], curB:order[1], next:null, champ:null };
  G.roundsToWin = 1;
}
function advanceTourney(winnerF){
  const T = G.tourney;
  T.results.push({a:T.curA, b:T.curB, w:winnerF.charIdx});
  if(T.stage==='sf1'){ T.w1=winnerF.charIdx; T.stage='sf2'; T.next=[T.order[2],T.order[3]]; }
  else if(T.stage==='sf2'){ T.w2=winnerF.charIdx; T.stage='final'; T.next=[T.w1,T.w2]; }
  else { T.champ=winnerF.charIdx; T.next=null; }
  if(T.next){ mode='tbracket'; SFX.round(); }
  else { G.finalWinner=winnerF; G.tourneyDone=true; hofRecord(); mode='matchend'; SFX.select(); }
}
function startTourneyDuel(){
  const T = G.tourney;
  const picks = T.next.slice();

  _suspendRecord = true;
  newMatch('duel', picks);

  G.tourney = Object.assign(saved, {curA:picks[0], curB:picks[1], next:null, champ:null});

let draftQueue=[], allPicks=[], draftGameMode='duel';
// --- taruhan tebak pemenang ---
let betCharId=null, betTeam=-1, betPending=null; // betPending={mode,picks}
let betStats={wins:0, losses:0, streak:0, best:0};
try{ const b=JSON.parse(localStorage.getItem('ss8_bet')||'{}'); if(b.wins!=null) betStats=b; }catch(e){}
function betSave(){ try{ localStorage.setItem('ss8_bet', JSON.stringify(betStats)); }catch(e){} }
function startDraft(gameMode){
  draftGameMode = gameMode;
  draftQueue = [];
  if(gameMode==='duel') draftQueue.push({need:2, label:'PILIH 2 NINJA — DUEL 1v1'});
  else if(gameMode==='team'){
    const sz=teamSetup.size;
    draftQueue.push({need:sz, label:'PILIH '+sz+' NINJA — TIM BIRU'});
    draftQueue.push({need:sz, label:'PILIH '+sz+' NINJA — TIM MERAH'});
    // respawn tanpa batas waktu = endless; paksa 3 menit
    if(teamSetup.respawn>0 && teamSetup.timeLimit===0) teamSetup.timeLimit=3;
  }
  else if(gameMode==='tourney') draftQueue.push({need:4, label:'PILIH 4 NINJA — TOURNAMENT'});
  else if(gameMode==='survival') draftQueue.push({need:survSetup.squad?3:1, label:'PILIH NINJA — SURVIVAL '+(survSetup.squad?'SQUAD (3)':'SOLO')});
  else if(gameMode==='boss') draftQueue.push({need:3, label:'PILIH 3 NINJA — LAWAN RAIJIN!'});
  else if(gameMode==='league') draftQueue.push({need:4, label:'PILIH 4 NINJA — LIGA'});
  else draftQueue.push({need:4, label:'PILIH 4 NINJA — DEATHMATCH'});
  allPicks = [];
  draft = Object.assign({picked:[]}, draftQueue.shift());
  mode = 'draft';
}
function toggleDraft(i){
  const p = draft.picked, at = p.indexOf(i);
  if(at>=0) p.splice(at,1);
  else if(p.length<draft.need){ p.push(i); SFX.select(); }
}
function randomDraft(){
  const idx=CHARS.map((_,i)=>i).sort(()=>Math.random()-0.5);
  draft.picked = idx.slice(0, draft.need);
  SFX.select();
}
function advanceDraft(){
  if(draft.picked.length<draft.need) return;
  allPicks = allPicks.concat(draft.picked);
  SFX.select();
  if(draftQueue.length) draft = Object.assign({picked:[]}, draftQueue.shift());
  else if(draftGameMode==='tourney') newTourney(allPicks);
  else if(draftGameMode==='survival') newSurvival(allPicks, survSetup);
  else if(draftGameMode==='boss') newBoss(allPicks);
  else if(draftGameMode==='league') newLeague(allPicks);
  else { betPending={mode:draftGameMode, picks:allPicks.slice()}; betCharId=null; betTeam=-1; mode='bet'; }
}
function placeBet(){
  // dipanggil setelah user pilih taruhan (atau lewati)
  const bp = betPending; betPending=null;
  if(bp) newMatch(bp.mode, bp.picks);
}

    e.preventDefault(); return;
  }
  if(k>='1'&&k<='8'){
    const n=+k;
    if(mode==='survsetup' && n<=3){ survSetup.enemies=n; SFX.select(); return; }
    if(mode==='modeselect' && n<=MODE_DEFS.length){ chooseMode(MODE_DEFS[n-1].id); return; }
    if(mode==='draft' && n<=CHARS.length){ toggleDraft(n-1); return; }
    if(mode==='fight'||mode==='roundend'){ speed = n<=2?n:4; return; }
  }
  if(mode==='draft'){
    const extra={'9':8,'0':9,'q':10,'Q':10,'w':11,'W':11,'e':12,'E':12,'r':13,'R':13,'t':14,'T':14,'y':15,'Y':15,'u':16,'U':16,'i':17,'I':17,'o':18,'O':18,'p':19,'P':19};
    if(k in extra && extra[k]<CHARS.length){ toggleDraft(extra[k]); return; }
  }
  if(mode==='bet' && betPending){
    const bp=betPending;
    if(k>='1' && k<='9'){
      const n=+k;
      if(bp.mode==='team' && n<=2){ betTeam=n-1; SFX.select(); placeBet(); return; }
      if(n<=bp.picks.length){ betCharId=CHARS[bp.picks[n-1]].id; SFX.select(); placeBet(); return; }
    }
    if(k==='0'){ SFX.select(); placeBet(); return; } // lewati
  }
  if(k==='r'||k==='R'){ if(G && (mode==='fight'||mode==='roundend')) startRound(); return; }
  if(k==='l'||k==='L'){ if(G && (mode==='fight'||mode==='roundend')){ cam.lock=!cam.lock; SFX.select(); } return; }
  // geser kamera manual saat unlock (PC: panah kiri/kanan)
  if((k==='ArrowLeft'||k==='ArrowRight') && G && !cam.lock && (mode==='fight'||mode==='roundend')){
    cam.tx = clamp(cam.tx + (k==='ArrowLeft'?-40:40), 0, WORLD_W-W);
    e.preventDefault(); return;
  }
  if(k==='Escape'){ if(mode==='survsetup'||mode==='teamsetup'){ mode='modeselect'; SFX.select(); } else { mode='title'; G=null; } return; }
  if(k==='Enter'){
    if(mode==='title'){ mode='modeselect'; SFX.select(); }
    else if(mode==='modeselect') chooseMode(MODE_DEFS[selMode].id);
    else if(mode==='survsetup') startDraft('survival');
    else if(mode==='teamsetup') startDraft('team');
    else if(mode==='draft') advanceDraft();
    else if(mode==='tbracket') startTourneyDuel();
    else if(mode==='lstandings'){
      const L=G.league;
      if(L.idx<L.matches.length) startLeagueDuel();
      else { G.leagueDone=true; mode='matchend'; }
      return;
    }
    else if(mode==='matchend' && G){
      if(lastGameMode==='tourney') newTourney(lastPicks);
      else if(lastGameMode==='survival') newSurvival(lastPicks, lastSurvSetup);
      else if(lastGameMode==='boss') newBoss(lastPicks);
      else if(lastGameMode==='league') newLeague(lastPicks);
      else newMatch(G.mode, lastPicks);
      return;
    }
    return;
  }
  if(mode==='modeselect'){
    if(k==='ArrowUp'){ selMode=(selMode+MODE_DEFS.length-1)%MODE_DEFS.length; SFX.select(); }
    if(k==='ArrowDown'){ selMode=(selMode+1)%MODE_DEFS.length; SFX.select(); }
  }
});
let lastPicks=[], lastGameMode='duel', _suspendRecord=false;
const _newMatch = newMatch;
newMatch = function(gameMode, picks){
  if(!_suspendRecord){ lastPicks=picks.slice(); lastGameMode=gameMode; }
  _newMatch(gameMode, picks);
};
const _newTourney = newTourney;
newTourney = function(picks){
  lastPicks=picks.slice(); lastGameMode='tourney';
  _suspendRecord = true;
  _newTourney(picks);
  _suspendRecord = false;
};
const _newSurvival = newSurvival;
let lastSurvSetup={enemies:2, squad:false};
newSurvival = function(picks, setup){
  lastPicks=picks.slice(); lastGameMode='survival'; lastSurvSetup=Object.assign({}, setup||{enemies:2, squad:false});
  _newSurvival(picks, setup);
};
const _newBoss = newBoss;
newBoss = function(picks){
  lastPicks=picks.slice(); lastGameMode='boss';
  _newBoss(picks);
};
const _newLeague = newLeague;
newLeague = function(picks){
  lastPicks=picks.slice(); lastGameMode='league';
  _suspendRecord = true;
  _newLeague(picks);
  _suspendRecord = false;
};

cv.addEventListener('pointerdown', e=>{
  audioInit();
  const r=cv.getBoundingClientRect();
  const mx=(e.clientX-r.left)/r.width*W, my=(e.clientY-r.top)/r.height*H;
  if(mode==='title'){ mode='modeselect'; SFX.select(); return; }
  if(mode==='modeselect'){
    // baris pengaturan (kecepatan + efek) — sebelum main
    if(my>=245&&my<=263){
      const spdVals=[1,2,4];
      for(let i=0;i<3;i++){
        const bx=92+i*38;
        if(mx>=bx&&mx<=bx+34){ menuSpeed=spdVals[i]; SFX.select(); return; }
      }
      const fxVals=[1,0];
      for(let i=0;i<2;i++){
        const bx=258+i*62;
        if(mx>=bx&&mx<=bx+58){ menuFx=fxVals[i]; SFX.select(); return; }
      }
      // tombol AI: klik untuk cycle tingkat
      if(mx>=406&&mx<=470){ aiLevel=(aiLevel+1)%AI_LEVELS.length; SFX.select(); return; }
    }
    MODE_DEFS.forEach((m,i)=>{
      const by=46+i*30;
      if(mx>=W/2-160&&mx<=W/2+160&&my>=by-14&&my<=by+14){ selMode=i; chooseMode(m.id); }
    });
    return;
  }
  if(mode==='survsetup'){
    for(let i=0;i<3;i++){
      const bx=150+i*60;
      if(mx>=bx&&mx<=bx+48&&my>=78&&my<=106){ survSetup.enemies=i+1; SFX.select(); return; }
    }
    if(mx>=140&&mx<=230&&my>=140&&my<=168){ survSetup.squad=false; SFX.select(); return; }
    if(mx>=250&&mx<=340&&my>=140&&my<=168){ survSetup.squad=true; SFX.select(); return; }
    if(mx>=W/2-70&&mx<=W/2+70&&my>=216&&my<=248){ startDraft('survival'); return; }
    return;
  }
  if(mode==='teamsetup'){
    const sizes=[2,3,4,5];
    sizes.forEach((s,i)=>{ const bx=110+i*68; if(mx>=bx&&mx<=bx+56&&my>=72&&my<=100){ teamSetup.size=s; SFX.select(); return; } });
    const rs=[0,3,5,10];
    rs.forEach((v,i)=>{ const bx=110+i*68; if(mx>=bx&&mx<=bx+56&&my>=132&&my<=160){ teamSetup.respawn=v; SFX.select(); return; } });
    const ts=[0,1,3,5];
    ts.forEach((v,i)=>{ const bx=110+i*68; if(mx>=bx&&mx<=bx+56&&my>=192&&my<=220){ teamSetup.timeLimit=v; SFX.select(); return; } });
    if(mx>=W/2-70&&mx<=W/2+70&&my>=228&&my<=256){ startDraft('team'); return; }
    return;
  }
  if(mode==='draft'){
    for(let i=0;i<CHARS.length;i++){
      const {bx,by}=draftCardXY(i);
      if(mx>=bx-42&&mx<=bx+42&&my>=by-22&&my<=by+22){ toggleDraft(i); return; }
    }
    if(mx>=W-150&&mx<=W-84&&my>=10&&my<=36){ advanceDraft(); return; }
    if(mx>=W-78&&mx<=W-12&&my>=10&&my<=36){ randomDraft(); return; }
    return;
  }
  if(mode==='bet' && betPending){
    const bp=betPending;
    // tombol lewati
    if(mx>=W/2-60&&mx<=W/2+60&&my>=210&&my<=236){ SFX.select(); placeBet(); return; }
    if(bp.mode==='team'){
      for(let ti=0;ti<2;ti++){
        const bx=W/2-160+ti*170, by=110;
        if(mx>=bx&&mx<=bx+150&&my>=by&&my<=by+60){ betTeam=ti; SFX.select(); placeBet(); return; }
      }
    } else {
      bp.picks.forEach((ci,i)=>{
        const bx=40+i*((W-80)/bp.picks.length), bw=(W-80)/bp.picks.length-8, by=110;
        if(mx>=bx&&mx<=bx+bw&&my>=by&&my<=by+70){
          betCharId=CHARS[ci].id; SFX.select(); placeBet(); return;
        }
      });
    }
    return;
  }
  if(mode==='matchend'){
    if(lastGameMode==='tourney') newTourney(lastPicks);
    else if(lastGameMode==='survival') newSurvival(lastPicks[0]);
    else if(lastGameMode==='boss') newBoss(lastPicks);
    else if(lastGameMode==='league') newLeague(lastPicks);
    else if(G) newMatch(G.mode, lastPicks);
    return;
  }
  if(mode==='tbracket'){ startTourneyDuel(); return; }
  if(mode==='lstandings'){
    const L=G.league;
    if(L.idx<L.matches.length) startLeagueDuel();
    else { G.leagueDone=true; mode='matchend'; }
    return;
  }
  if(mode==='fight'||mode==='roundend'){
    // toggle auto-lock kamera (simbol pojok kanan atas) — cek dulu sebelum jeda!
    if(mx>=W-36 && my<=38){ cam.lock=!cam.lock; SFX.select(); return; }
    // mulai drag kamera manual saat unlock
    if(!cam.lock){ camDrag={sx:mx, stx:cam.tx, moved:false}; return; }
    paused=!paused;
  }
});
cv.addEventListener('pointermove', e=>{
  if(!camDrag || cam.lock) return;
  const r=cv.getBoundingClientRect();
  const mx=(e.clientX-r.left)/r.width*W;
  const dx=mx-camDrag.sx;
  if(Math.abs(dx)>8) camDrag.moved=true;
  if(camDrag.moved) cam.tx=clamp(camDrag.stx-dx, 0, WORLD_W-W);
});
cv.addEventListener('pointerup', e=>{
  if(camDrag){
    // tap (tanpa geser) = jeda; geser = kamera saja
    if(!camDrag.moved && (mode==='fight'||mode==='roundend')) paused=!paused;
    camDrag=null;
  }
});
cv.addEventListener('pointercancel', ()=>{ camDrag=null; });

// ---------- loop ----------
// kunci 60fps: di monitor 120Hz/144Hz game tidak boleh jalan 2x lebih cepat
let lastFrameT=0;
function frame(t){
  requestAnimationFrame(frame);
  if(lastFrameT && t-lastFrameT < 16.6) return;
  lastFrameT = t;
  ctx.save();
  if(shake>0.5) ctx.translate(rnd(-shake,shake)*0.5, rnd(-shake,shake)*0.5);

  if(mode==='title') drawTitle();
  else if(mode==='modeselect') drawModeSelect();
  else if(mode==='survsetup') drawSurvSetup();
  else if(mode==='teamsetup') drawTeamSetup();
  else if(mode==='draft') drawDraft();
  else if(mode==='bet') drawBet();
  else if(mode==='lstandings'){
    drawLStandings();
    // auto-lanjut ke duel berikutnya setelah 3 detik
    if(G && G.lstandT>0 && --G.lstandT<=0){
      const L=G.league;
      if(L.idx<L.matches.length) startLeagueDuel();
      else { G.leagueDone=true; mode='matchend'; }
    }
  }
  else if(mode==='tbracket') drawTBracket();
  else if(mode==='matchend') drawMatchEnd();
  else if(G){
    drawSky();
    ctx.save();
    ctx.translate(-Math.round(cam.x), 0);
    drawWorld();
    drawHazards();
    drawOrbs();
    drawProjectiles();
    for(const f of G.fighters){ f.draw(); drawFighterTag(f); }
    drawFx();
    ctx.restore();
    // banner ultimate sinematik
    if(G.ultFreeze && G.ultFreeze.state==='ultimate'){
      rect(0,0,W,H,'rgba(5,0,15,0.55)');
      const uf=G.ultFreeze;
      centerText('⚡ ULTIMATE ⚡', 100, 14, '#c88cff', '#000');
      centerText(uf.def.ult.name, 128, 22, '#ffffff', '#4a1a7a');
      centerText(uf.def.name, 150, 11, uf.def.color, '#000');
    }
    drawHUD();
    drawComm();
    drawKillFeed();
    drawStatsPanel();
    drawCamLock();
    if(G.phase==='intro'){
      const t = G.phaseT>55 ? 'ROUND '+G.round : 'FIGHT!';
      centerText(t, 130, 22, '#ffd94d', '#7a2e00');
      if(G.phaseT>55){
        ctx.font='9px monospace'; ctx.textAlign='center'; ctx.fillStyle='#8a8aa8';
        ctx.fillText('— '+curStage.name+' —', W/2, 148);
      }
    }
    else if(G.phase==='roundend' && G.winnerLabel){
      if(G.slowmo>0) centerText('FINISH!', 110, 26, '#ffd94d', '#7a2e00');
      else centerText(G.winnerLabel, 110, 18, '#ffd94d', '#7a2e00');
    }
    if(paused){
      rect(0,0,W,H,'rgba(0,0,0,0.5)');
      centerText('JEDA — klik/Spasi untuk lanjut', H/2, 12, '#fff');
      ctx.font='9px monospace'; ctx.textAlign='center'; ctx.fillStyle='#8a8aa8';
      ctx.fillText('Kecepatan: '+speed+'x (atur di menu awal) · R: ulangi ronde · Esc: menu', W/2, H/2+22);
    }
  }
  ctx.restore();
  if(!paused){
    updateComm();
    updateKillFeed();
    // slow-mo FINISH (batch 4): simulasi berjalan 1/3 kecepatan
    let skipSim = false;
    if(G && G.slowmo>0){ G.slowmo--; skipSim = (G.slowmo%3)!==0; }
    if(!skipSim){
      if(mode==='fight'||mode==='roundend') updateCamera();
      if(mode==='fight') updateFight();
      else if(mode==='roundend') updateRoundEnd();
    }
  }
}
requestAnimationFrame(frame);
</script>
